<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AWS Link Shortener</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Iconos de FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Archivo de estilos personalizados -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <!-- Card Principal -->
  <div class="max-w-xl w-full bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl p-6 sm:p-8 space-y-6">
    
    <!-- Encabezado -->
    <div class="text-center space-y-2">
      <div class="inline-flex items-center gap-2 px-3 py-1 bg-amber-500/10 border border-amber-500/20 text-amber-400 rounded-full text-xs font-semibold uppercase tracking-wider mb-2">
        <i class="fa-brands fa-aws text-base"></i> AWS Serverless & EC2
      </div>
      <h1 class="text-3xl font-extrabold text-white tracking-tight sm:text-4xl">
        Acortador de Enlaces
      </h1>
      <p class="text-slate-400 text-sm sm:text-base">
        Genera enlaces cortos y seguros respaldados por FastAPI y DynamoDB.
      </p>
    </div>

    <!-- Formulario -->
    <form id="shortenForm" onsubmit="shortenUrl(event)" class="space-y-4">
      <div>
        <label for="originalUrl" class="block text-sm font-medium text-slate-300 mb-2">
          Ingresa tu URL larga:
        </label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i class="fa-solid fa-link"></i>
          </div>
          <input 
            type="url" 
            id="originalUrl" 
            required
            placeholder="https://www.ejemplo.com/mi-enlace-muy-largo"
            class="w-full pl-10 pr-4 py-3 bg-slate-900/80 border border-slate-700 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all text-sm"
          />
        </div>
      </div>

      <button 
        type="submit" 
        id="submitBtn"
        class="w-full bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-indigo-600/30 transition-all flex items-center justify-center gap-2 text-sm cursor-pointer"
      >
        <span>Acortar URL</span>
        <i class="fa-solid fa-wand-magic-sparkles"></i>
      </button>
    </form>

    <!-- Contenedor de Resultado (Oculto por defecto) -->
    <div id="resultContainer" class="hidden mt-6 pt-6 border-t border-slate-700 space-y-4">
      <div class="flex items-center gap-2 text-emerald-400 text-sm font-medium">
        <i class="fa-solid fa-circle-check"></i>
        <span>¡Enlace generado con éxito!</span>
      </div>

      <div class="flex flex-col sm:flex-row items-center gap-2">
        <div class="relative w-full">
          <input 
            type="text" 
            id="shortUrlInput" 
            readonly
            class="w-full py-2.5 px-3.5 bg-slate-900 border border-slate-700 rounded-lg text-indigo-300 font-mono text-sm focus:outline-none"
          />
        </div>
        
        <button 
          type="button"
          onclick="copyToClipboard()" 
          id="copyBtn"
          class="w-full sm:w-auto px-4 py-2.5 bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm font-medium rounded-lg transition-all flex items-center justify-center gap-2 cursor-pointer"
        >
          <i class="fa-regular fa-copy"></i>
          <span id="copyText">Copiar</span>
        </button>
      </div>

      <div class="pt-2">
        <a 
          id="testLink" 
          href="#" 
          target="_blank" 
          class="inline-flex items-center justify-center w-full py-2.5 px-4 bg-emerald-600/10 hover:bg-emerald-600/20 text-emerald-400 border border-emerald-500/20 rounded-lg text-sm font-medium transition-all gap-2"
        >
          <span>Probar enlace corto</span>
          <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
        </a>
      </div>
    </div>

    <!-- Mensaje de Error (Oculto por defecto) -->
    <div id="errorMessage" class="hidden mt-4 p-3.5 bg-rose-500/10 border border-rose-500/20 rounded-xl text-rose-400 text-sm flex items-start gap-2.5">
      <i class="fa-solid fa-triangle-exclamation mt-0.5"></i>
      <span id="errorText">No se pudo conectar con el backend.</span>
    </div>

  </div>

  <!-- Archivo JavaScript -->
  <script src="script.js"></script>
</body>
</html>
